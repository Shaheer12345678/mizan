[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.1.0"
description = "Command line expense and budget tracker backed by SQLite."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Shaheer Shakir" }]
keywords = ["cli", "budget", "expenses", "sqlite", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Shaheer12345678/mizan"
Changelog = "https://github.com/Shaheer12345678/mizan/blob/main/CHANGELOG.md"

[project.scripts]
mizan = "mizan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mizan = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PTH",  # prefer pathlib
    "RET",  # return simplification
    "RUF",  # ruff-specific
    "SIM",  # simplification
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Typer reads defaults from the signature, so calls in argument defaults are the idiom.
"src/mizan/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/mizan", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
